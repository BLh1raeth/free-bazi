name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - codex-ios-app-foundation
    paths:
      - "mobile/**"
      - "src/lib/bazi/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-ios-unsigned.yml"

permissions:
  contents: read

jobs:
  build:
    name: Xcode 26.6 device build
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_USE_SOURCE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate TypeScript and algorithm tests
        run: |
          pnpm mobile:typecheck
          pnpm test

      - name: Generate native iOS project
        run: pnpm --dir mobile exec expo prebuild --platform ios --no-install --clean

      - name: Verify Liquid Glass build contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./mobile/app.json').expo.ios.infoPlist.UIDesignRequiresCompatibility")" = "false"
          grep -q 'NSClassFromString("UIGlassEffect")' mobile/node_modules/expo-glass-effect/ios/GlassEffectModule.swift
          grep -q 'UIGlassEffect(style:' mobile/node_modules/expo-glass-effect/ios/GlassView.swift
          grep -q 'compiler(>=6.2)' mobile/node_modules/expo-glass-effect/ios/GlassEffectModule.swift

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Build unsigned arm64 app
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/ios
          workspace="$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(xcodebuild -workspace "$workspace" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["workspace"]["schemes"][0])')"
          test -n "$scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/yuanxu-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Package and audit unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/yuanxu-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$app"
          plist="$app/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")" = "元序"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIDesignRequiresCompatibility' "$plist")" = "false"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          file "$app/$executable" | grep -q 'arm64'

          # xcodebuild can leave an empty/ad-hoc signature directory even with
          # CODE_SIGNING_ALLOWED=NO. Remove it before packaging so a local
          # signer can apply the user's distribution certificate recursively.
          rm -rf "$app/_CodeSignature"
          test ! -d "$app/_CodeSignature"

          output="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$output/Payload"
          ditto "$app" "$output/Payload/$(basename "$app")"
          cd "$output"
          ditto -c -k --sequesterRsrc --keepParent Payload YuanXu-0.5.0-unsigned.ipa
          rm -rf Payload
          shasum -a 256 YuanXu-0.5.0-unsigned.ipa > YuanXu-0.5.0-unsigned.ipa.sha256
          unzip -l YuanXu-0.5.0-unsigned.ipa | head -n 30
          cat YuanXu-0.5.0-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YuanXu-0.5.0-unsigned-ios
          path: |
            artifacts/YuanXu-0.5.0-unsigned.ipa
            artifacts/YuanXu-0.5.0-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
