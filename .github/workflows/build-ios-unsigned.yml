name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - codex-ios-app-foundation
    paths:
      - "mobile/**"
      - "src/lib/bazi/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-ios-unsigned.yml"

permissions:
  contents: read

jobs:
  build:
    name: Xcode 26.6 device build
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_USE_SOURCE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate TypeScript and algorithm tests
        run: |
          pnpm mobile:typecheck
          pnpm test

      - name: Generate native iOS project
        run: pnpm --dir mobile exec expo prebuild --platform ios --no-install --clean

      - name: Verify Liquid Glass build contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./mobile/app.json').expo.ios.infoPlist.UIDesignRequiresCompatibility")" = "false"
          grep -q 'NSClassFromString("UIGlassEffect")' mobile/node_modules/expo-glass-effect/ios/GlassEffectModule.swift
          grep -q 'UIGlassEffect(style:' mobile/node_modules/expo-glass-effect/ios/GlassView.swift
          grep -q 'compiler(>=6.2)' mobile/node_modules/expo-glass-effect/ios/GlassEffectModule.swift

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Build unsigned arm64 app
        shell: bash
        run: |
          set -euo pipefail
          cd mobile/ios
          workspace="$(find . -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          project="$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$workspace"
          test -n "$project"
          # The workspace list starts with CocoaPods library schemes on recent
          # Xcode versions. Read the application scheme from the app project,
          # then build that scheme through the workspace so Pods are linked.
          scheme="$(xcodebuild -project "$project" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')"
          test -n "$scheme"
          echo "Building application scheme: $scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/yuanxu-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Package and audit unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/yuanxu-derived/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$app"
          plist="$app/Info.plist"
          echo "IPA audit: stamping Info.plist for the unsigned archive"
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName 元序' "$plist"
          else
            /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string 元序' "$plist"
          fi
          if /usr/libexec/PlistBuddy -c 'Print :UIDesignRequiresCompatibility' "$plist" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Set :UIDesignRequiresCompatibility false' "$plist"
          else
            /usr/libexec/PlistBuddy -c 'Add :UIDesignRequiresCompatibility bool false' "$plist"
          fi
          plutil -lint "$plist"
          display_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")"
          compatibility="$(/usr/libexec/PlistBuddy -c 'Print :UIDesignRequiresCompatibility' "$plist")"
          echo "CFBundleDisplayName=$display_name"
          echo "UIDesignRequiresCompatibility=${compatibility:-absent-native-default}"
          test "$display_name" = "元序"
          case "$compatibility" in
            ""|false|False|NO|No|0) ;;
            *)
              echo "Unexpected UIDesignRequiresCompatibility value: $compatibility" >&2
              exit 1
              ;;
          esac
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          file "$app/$executable" | grep -q 'arm64'
          echo "IPA audit: arm64 executable verified"

          # xcodebuild can leave an empty/ad-hoc signature directory even with
          # CODE_SIGNING_ALLOWED=NO. Remove it before packaging so a local
          # signer can apply the user's distribution certificate recursively.
          find "$app" -type d -name '_CodeSignature' -prune -exec rm -rf {} +
          find "$app" -type f -name 'embedded.mobileprovision' -delete
          if find "$app" -type d -name '_CodeSignature' -print -quit | grep -q .; then
            echo "Signature data was not removed from the package" >&2
            exit 1
          fi
          echo "IPA audit: signature data removed"

          output="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$output/Payload"
          ditto "$app" "$output/Payload/$(basename "$app")"
          cd "$output"
          ditto -c -k --sequesterRsrc --keepParent Payload YuanXu-0.5.4-liquid-glass.ipa
          rm -rf Payload
          test -s YuanXu-0.5.4-liquid-glass.ipa
          shasum -a 256 YuanXu-0.5.4-liquid-glass.ipa > YuanXu-0.5.4-liquid-glass.ipa.sha256
          unzip -l YuanXu-0.5.4-liquid-glass.ipa > YuanXu-0.5.4-liquid-glass.ipa.contents.txt
          sed -n '1,30p' YuanXu-0.5.4-liquid-glass.ipa.contents.txt
          cat YuanXu-0.5.4-liquid-glass.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YuanXu-0.5.4-liquid-glass-ios
          path: |
            artifacts/YuanXu-0.5.4-liquid-glass.ipa
            artifacts/YuanXu-0.5.4-liquid-glass.ipa.sha256
            artifacts/YuanXu-0.5.4-liquid-glass.ipa.contents.txt
          if-no-files-found: error
          retention-days: 14
